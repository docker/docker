name: bin-image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs without interrupting push, tag, scheduled, or
  # manually dispatched validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[0-9]+.[0-9]+'
      - '[0-9]+.x'
    tags:
      - 'v*'
      - 'docker-v*'
  pull_request:

jobs:
  validate-dco:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      pull-requests: read
    uses: ./.github/workflows/.dco.yml

  build:
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only')) }}
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    needs:
      - validate-dco
    permissions:
      contents: read # same as global permission
      id-token: write # for signing attestation(s) and authenticating to Docker Hub with GitHub OIDC Token
    with:
      setup-qemu: true
      buildkit-proxy-network: true
      target: bin-image-cross
      cache: true
      cache-scope: bin-image
      output: image
      push: ${{ github.event_name != 'pull_request' && github.repository == 'moby/moby' }}
      vars: |
        DOCKER_GITCOMMIT=${{ github.sha }}
        VERSION=${{ github.ref }}
        PLATFORM=Moby Engine - Nightly
        PRODUCT=moby-bin
        PACKAGER_NAME=The Moby Project
      meta-images: |
        moby/moby-bin
      ### versioning strategy
      ## push tag docker-v23.0.0
      # moby/moby-bin:23.0.0
      # moby/moby-bin:23.0
      # moby/moby-bin:23
      # moby/moby-bin:latest
      ## push tag docker-v23.0.0-beta.1
      # moby/moby-bin:23.0.0-beta.1
      ## push on master
      # moby/moby-bin:master
      ## push on 28.x branch
      # moby/moby-bin:28.x
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}},match=docker-(.*)
        type=semver,pattern={{major}}.{{minor}},match=docker-(.*)
        type=semver,pattern={{major}},match=docker-(.*)
      registry-identities: |
        - type: dockerhub
          username: moby
          connection_id: ${{ vars.MOBYBIN_DOCKERHUB_OIDC_CONNECTIONID }}
