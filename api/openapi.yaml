          x-nullable: true
          type: "array"
          items:
            $ref: "#/components/schemas/ContainerBlkioStatEntry"
        io_merged_recursive:
          description: |
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
          x-nullable: true
          type: "array"
          items:
            $ref: "#/components/schemas/ContainerBlkioStatEntry"
        io_time_recursive:
          description: |
            This field is only available when using Linux containers with
            cgroups v1. It is omitted or `null` when using cgroups v2.
          x-nullable: true
          type: "array"
          items:
            $ref: "#/components/schemas/ContainerBlkioStatEntry"
        sectors_recursive:
          description: |
